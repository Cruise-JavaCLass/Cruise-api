server:
  port: 8081

spring:
  application:
    name: cruise-auth-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:postgres}
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cruise_db}}
    username: ${DB_USERNAME:cruise_admin}
    password: ${DB_PASSWORD:cruise_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: AuthHikariPool
      minimum-idle: 2
      maximum-pool-size: 10
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 20000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

jwt:
  secret: ${JWT_SECRET:cruise-secret-key-super-secure-token-2026-auth-jwt-system}
  issuer: ${JWT_ISSUER:cruise-auth-service}
  expiration-millis: ${JWT_EXPIRATION_MILLIS:86400000}
  access-token:
    expiration-millis: ${JWT_ACCESS_EXPIRATION_MILLIS:86400000} # 24 giờ
  refresh-token:
    expiration-millis: ${JWT_REFRESH_EXPIRATION_MILLIS:604800000} # 7 ngày
