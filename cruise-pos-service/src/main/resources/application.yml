server:
  port: 8084

spring:
  application:
    name: cruise-pos-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:postgres}
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cruise_db}}
    username: ${DB_USERNAME:cruise_admin}
    password: ${DB_PASSWORD:cruise_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: PosHikariPool
      minimum-idle: 2
      maximum-pool-size: 10
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 20000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

pos:
  security:
    # Bật JWT (401/403) sau khi toàn bộ client đã gửi Authorization header.
    enabled: ${POS_SECURITY_ENABLED:true}
  payment:
    bank:
      webhook-secret: ${BANK_WEBHOOK_SECRET:vietqr-bank-secret-key-32bytes-len}
      enforce-signature: ${BANK_WEBHOOK_ENFORCE_SIGNATURE:true}
  managers:
    MGR-01: "2926a2731f4b312c08982cacf8061eb14bf65c1a87cc5d70e864e079c6220731"
    MGR-LE: "2926a2731f4b312c08982cacf8061eb14bf65c1a87cc5d70e864e079c6220731"
    MANAGER-DEFAULT: "2926a2731f4b312c08982cacf8061eb14bf65c1a87cc5d70e864e079c6220731"
    MGR-ADMIN: "888df25ae35772424a560c7152a1de794440e0ea5cfee62828333a456a506e05"

jwt:
  # Bắt buộc set qua biến môi trường JWT_SECRET. Không có giá trị mặc định trong mã nguồn.
  secret: ${JWT_SECRET:}
