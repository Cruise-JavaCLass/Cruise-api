spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:cruise_activity_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
cruise:
  security:
    qr:
      secret: "CruiseActivityDevSecretKeyMustBe32BytesLong!"
