name: Backend CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (Java 21 / Maven)
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java JDK 21 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Cache SonarCloud Packages
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Grant Execute Permission for Maven Wrapper
        run: chmod +x ./mvnw

      - name: Verify Build & Run All Microservice Test Suites
        run: ./mvnw -B verify --file pom.xml
        env:
          CI: true

      - name: SonarCloud Code Analysis & Quality Gate Check
        if: env.SONAR_TOKEN != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.qualitygate.wait=true

      - name: Upload JaCoCo Code Coverage Reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-jacoco-reports
          path: '**/target/site/jacoco/'
          retention-days: 14

      - name: Upload Surefire Test Result XMLs
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: surefire-test-results
          path: '**/target/surefire-reports/'
          retention-days: 7
