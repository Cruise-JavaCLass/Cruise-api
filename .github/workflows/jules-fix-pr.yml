name: Jules PR Auto-Fixer

on:
  workflow_run:
    workflows:
      - 'Backend CI Pipeline'
    types:
      - completed
  issue_comment:
    types:
      - created
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull Request number'
        required: true
        type: string
      pr_branch:
        description: 'Branch of the Pull Request'
        required: true
        type: string
      failure_type:
        description: 'Reason / Type (e.g. sonarcloud, coderabbit, ci-test)'
        required: false
        default: 'manual-trigger'

concurrency:
  group: jules-fix-pr-${{ github.event.workflow_run.id || github.event.issue.number || inputs.pr_number }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  fix-pr:
    name: Auto-Fix PR with Google Jules
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Process only if:
    # 1. Manual trigger via workflow_dispatch
    # 2. Or issue_comment on a PR mentioning '@jules fix'
    # 3. Or workflow_run failed on a PR branch (not default branch)
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@jules fix')) ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'failure' &&
        github.event.workflow_run.head_branch != (github.event.repository.default_branch || 'main') &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Resolve PR Information and Trigger Jules
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.issue.number || github.event.workflow_run.pull_requests[0].number }}
          PR_BRANCH: ${{ inputs.pr_branch || github.event.workflow_run.head_branch }}
          FAILURE_TYPE: ${{ inputs.failure_type || 'ci-failure-or-review' }}
          FAILURE_DETAILS: ${{ github.event.comment.body || format('Workflow {0} (Run ID {1}) failed on branch {2}', github.event.workflow_run.name, github.event.workflow_run.id, github.event.workflow_run.head_branch) }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: node .github/scripts/run-fix-pr.mjs
