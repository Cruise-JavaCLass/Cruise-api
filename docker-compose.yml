services:
  postgres:
    image: postgres:16-alpine
    container_name: cruise-postgres
    environment:
      POSTGRES_USER: cruise_admin
      POSTGRES_PASSWORD: cruise_password
      POSTGRES_DB: cruise_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
